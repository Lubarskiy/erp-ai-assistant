version: "3.9"

services:
  api:
    build: .
    container_name: erp_ai_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: erp_ai_db
    environment:
      POSTGRES_DB: erp_ai
      POSTGRES_USER: erp_ai_user
      POSTGRES_PASSWORD: erp_ai_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
