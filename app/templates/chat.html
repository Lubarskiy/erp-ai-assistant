<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>ERP AI Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; }
    #messages { border: 1px solid #ddd; padding: 12px; min-height: 300px; margin-bottom: 12px; }
    .msg { margin: 8px 0; }
    .role { font-weight: bold; }
    textarea { width: 100%; height: 80px; }
  </style>
</head>
<body>
  <h1>ERP AI Assistant</h1>
  <div id="messages"></div>
  <textarea id="text" placeholder="Введите вопрос"></textarea>
  <button id="send">Send</button>

  <script>
    let sessionId = null;
    const messages = document.getElementById('messages');
    const text = document.getElementById('text');

    async function ensureSession() {
      if (sessionId) return sessionId;
      const res = await fetch('/api/v1/chat/new-session', {method: 'POST'});
      const data = await res.json();
      sessionId = data.session_id;
      return sessionId;
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = '<span class="role">' + role + ':</span> ' + content;
      messages.appendChild(div);
    }

    document.getElementById('send').addEventListener('click', async () => {
      const sid = await ensureSession();
      const value = text.value.trim();
      if (!value) return;
      addMessage('user', value);
      text.value = '';
      const res = await fetch('/api/v1/chat/message', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: sid, text: value})
      });
      const data = await res.json();
      addMessage('assistant', data.text_summary);
    });
  </script>
</body>
</html>
